<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活動報到系統</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }
    header img {
      height: 56px;
      margin-bottom: 10px;
    }
    header h1 {
      font-size: 1.5rem;
      color: #1a3a5c;
      font-weight: 700;
    }
    header p {
      font-size: 0.85rem;
      color: #6b7280;
      margin-top: 4px;
    }

    .search-box {
      width: 100%;
      max-width: 540px;
      position: relative;
      margin-bottom: 18px;
    }
    .search-box input {
      width: 100%;
      padding: 14px 48px 14px 18px;
      font-size: 1.1rem;
      border: 2px solid #d1d5db;
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s;
      background: white;
    }
    .search-box input:focus {
      border-color: #2563eb;
    }
    .clear-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #9ca3af;
      font-size: 1.2rem;
      display: none;
      padding: 4px;
      line-height: 1;
    }

    .stats-bar {
      width: 100%;
      max-width: 540px;
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }
    .stat-chip {
      background: white;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.8rem;
      color: #374151;
      border: 1px solid #e5e7eb;
      flex: 1;
      text-align: center;
    }
    .stat-chip strong {
      display: block;
      font-size: 1.3rem;
      font-weight: 700;
      color: #1a3a5c;
    }
    .stat-chip.done strong { color: #059669; }
    .stat-chip.pending strong { color: #dc2626; }

    .results {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .attendee-card {
      background: white;
      border-radius: 14px;
      padding: 18px 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      border-left: 5px solid #2563eb;
    }
    .attendee-card.checked-in {
      border-left-color: #10b981;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .card-name {
      font-size: 1.2rem;
      font-weight: 700;
      color: #111827;
    }
    .card-badge {
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 600;
    }
    .badge-pending { background: #dbeafe; color: #1d4ed8; }
    .badge-done    { background: #d1fae5; color: #065f46; }

    .card-info {
      font-size: 0.9rem;
      color: #374151;
      background: #f9fafb;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 12px;
      line-height: 1.9;
      white-space: pre-line;
      border: 1px solid #f3f4f6;
    }

    .btn-checkin {
      width: 100%;
      padding: 11px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-checkin:hover:not(:disabled) { background: #1d4ed8; }
    .btn-checkin:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    .btn-checkin.loading { background: #60a5fa; cursor: wait; }

    .empty-state {
      text-align: center;
      color: #9ca3af;
      padding: 48px 20px;
      font-size: 0.95rem;
    }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #111827;
      color: white;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 500;
      transition: transform 0.3s ease;
      z-index: 100;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { background: #065f46; }
    .toast.error   { background: #991b1b; }

    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      gap: 14px;
      font-size: 0.95rem;
      color: #374151;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e5e7eb;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .warn-banner {
      width: 100%;
      max-width: 540px;
      background: #fef3c7;
      border: 1px solid #fcd34d;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 0.85rem;
      color: #92400e;
      margin-bottom: 18px;
    }
    .warn-banner strong { display: block; margin-bottom: 4px; }

    .refresh-btn {
      background: none;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      color: #6b7280;
      margin-top: 8px;
    }
    .refresh-btn:hover { background: #f3f4f6; }
  </style>
</head>
<body>

<!-- =============================================
     設定區：填入你的 Apps Script 網址
     ============================================= -->
<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyq4Wo_ZICrWK1GIglnVVduw5cJFaXL5bEd6-Ghm5We7alzlmpSOEVamhLrNYMnrNhC/exec";
  const EVENT_NAME = "2026 蘇澳活動";
</script>
<!-- ============================================= -->

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <span>載入賓客名單中…</span>
</div>

<div class="toast" id="toast"></div>

<header>
  <img src="LOGOup.png" alt="Logo" onerror="this.style.display='none'">
  <h1 id="eventTitle">報到系統</h1>
  <p id="subtitle">正在讀取資料…</p>
</header>

<div id="warnBanner" class="warn-banner" style="display:none">
  <strong>⚠️ 尚未設定 Apps Script 網址</strong>
  請開啟 checkin.html，在頂部設定區填入 APPS_SCRIPT_URL。
</div>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="輸入賓客姓名搜尋…" autocomplete="off" oninput="onSearch(this.value)">
  <button class="clear-btn" id="clearBtn" onclick="clearSearch()">✕</button>
</div>

<div class="stats-bar" id="statsBar" style="display:none">
  <div class="stat-chip">總人數<strong id="statTotal">0</strong></div>
  <div class="stat-chip done">已報到<strong id="statDone">0</strong></div>
  <div class="stat-chip pending">未報到<strong id="statPending">0</strong></div>
</div>

<div class="results" id="results">
  <div class="empty-state">請輸入姓名開始搜尋</div>
</div>

<script>
  let attendees = [];

  document.getElementById("eventTitle").textContent = EVENT_NAME + " 報到系統";

  // ---------- 資料載入 ----------
  async function loadData() {
    if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL === "YOUR_APPS_SCRIPT_URL_HERE") {
      document.getElementById("warnBanner").style.display = "block";
      document.getElementById("subtitle").textContent = "⚠️ 請設定 Apps Script 網址";
      document.getElementById("loadingOverlay").style.display = "none";
      return;
    }
    try {
      const url = APPS_SCRIPT_URL + "?action=getAll&t=" + Date.now();
      const res = await fetch(url);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      attendees = data.attendees || [];
      renderStats();
      document.getElementById("statsBar").style.display = "flex";
      document.getElementById("subtitle").textContent = `已載入 ${attendees.length} 位賓客`;
    } catch (e) {
      document.getElementById("subtitle").textContent = "❌ 載入失敗，請確認設定";
      showToast("載入失敗：" + e.message, "error");
    } finally {
      document.getElementById("loadingOverlay").style.display = "none";
    }
  }

  function renderStats() {
    const done = attendees.filter(a => a.checkedIn).length;
    document.getElementById("statTotal").textContent = attendees.length;
    document.getElementById("statDone").textContent = done;
    document.getElementById("statPending").textContent = attendees.length - done;
  }

  // ---------- 搜尋 ----------
  function onSearch(q) {
    const clearBtn = document.getElementById("clearBtn");
    clearBtn.style.display = q ? "block" : "none";

    q = q.trim();
    if (!q) {
      document.getElementById("results").innerHTML =
        '<div class="empty-state">請輸入姓名開始搜尋</div>';
      return;
    }
    const matched = attendees.filter(a => a.name.includes(q));
    renderCards(matched);
  }

  function clearSearch() {
    const input = document.getElementById("searchInput");
    input.value = "";
    onSearch("");
    input.focus();
  }

  // ---------- 渲染卡片 ----------
  function renderCards(list) {
    const el = document.getElementById("results");
    if (list.length === 0) {
      el.innerHTML = '<div class="empty-state">找不到此賓客<br><small style="color:#d1d5db">請確認姓名是否正確</small></div>';
      return;
    }
    el.innerHTML = list.map(a => cardHTML(a)).join("");
  }

  function cardHTML(a) {
    const info = [
      `您好 ${a.name} ${a.title}：`,
      `您的資料如下：`,
      `方案：${a.plan}`,
      `身分：${a.identity}`,
      `序號：${a.seq} 號`,
      `桌次：${a.table} 桌`,
      `備註：${a.note || "－"}`
    ].join("\n");

    return `
    <div class="attendee-card ${a.checkedIn ? 'checked-in' : ''}" id="card-${a.rowIndex}">
      <div class="card-header">
        <div class="card-name">${a.name} ${a.title}</div>
        <div class="card-badge ${a.checkedIn ? 'badge-done' : 'badge-pending'}" id="badge-${a.rowIndex}">
          ${a.checkedIn ? '✓ 已報到' : '未報到'}
        </div>
      </div>
      <div class="card-info">${info}</div>
      <button class="btn-checkin" id="btn-${a.rowIndex}"
        ${a.checkedIn ? 'disabled' : ''}
        onclick="doCheckIn(${a.rowIndex}, '${a.name.replace(/'/g,"\\'")}')">
        ${a.checkedIn ? '已完成報到' : '✓ 確認報到'}
      </button>
    </div>`;
  }

  // ---------- 報到 ----------
  async function doCheckIn(rowIndex, name) {
    const btn  = document.getElementById("btn-" + rowIndex);
    const card = document.getElementById("card-" + rowIndex);
    const badge = document.getElementById("badge-" + rowIndex);

    btn.disabled = true;
    btn.classList.add("loading");
    btn.textContent = "報到中…";

    try {
      const url = `${APPS_SCRIPT_URL}?action=checkIn&rowIndex=${rowIndex}&t=${Date.now()}`;
      const res = await fetch(url);
      const data = await res.json();
      if (!data.success) throw new Error(data.error || "未知錯誤");

      // 更新本地資料
      const a = attendees.find(x => x.rowIndex === rowIndex);
      if (a) a.checkedIn = true;

      card.classList.add("checked-in");
      btn.textContent = "已完成報到";
      badge.className = "card-badge badge-done";
      badge.textContent = "✓ 已報到";

      renderStats();
      showToast(`${name} 報到成功！`, "success");
    } catch (e) {
      btn.disabled = false;
      btn.classList.remove("loading");
      btn.textContent = "✓ 確認報到";
      showToast("報到失敗：" + e.message, "error");
    }
  }

  // ---------- Toast ----------
  function showToast(msg, type = "") {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "toast show " + type;
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.className = "toast " + type; }, 3000);
  }

  // ---------- 啟動 ----------
  loadData();
</script>
</body>
</html>
